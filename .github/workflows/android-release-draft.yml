name: Prepare signed YUBERA Android release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version (e.g. 0.3.0)
        required: true
        type: string
      version_code:
        description: Monotonic Android versionCode
        required: true
        type: string
      minimum_supported_version_code:
        description: Minimum versionCode allowed to update from
        required: true
        default: "1"
        type: string
      release_notes:
        description: Release notes
        required: false
        type: string
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yubera-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/yubera-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :app:assembleRelease -PYUBERA_VERSION_CODE=${{ inputs.version_code }} -PYUBERA_VERSION_NAME=${{ inputs.version_name }}
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/yubera-${{ inputs.version_name }}.apk"
      - name: Generate manifest
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          MINIMUM_VERSION_CODE: ${{ inputs.minimum_supported_version_code }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          APK_FILE: release-assets/yubera-${{ inputs.version_name }}.apk
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          apk=pathlib.Path(os.environ["APK_FILE"]); version=os.environ["VERSION_NAME"]
          manifest={"schemaVersion":1,"versionCode":int(os.environ["VERSION_CODE"]),"versionName":version,
            "minimumSupportedVersionCode":int(os.environ["MINIMUM_VERSION_CODE"]),"releaseNotes":os.environ.get("RELEASE_NOTES",""),
            "apkUrl":f"https://github.com/{os.environ['REPOSITORY']}/releases/download/v{version}/{apk.name}",
            "apkSha256":hashlib.sha256(apk.read_bytes()).hexdigest(),"fileSizeBytes":apk.stat().st_size,
            "publishedAt":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path("release-assets/yubera-update.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          target_commitish: main
          name: YUBERA Android ${{ inputs.version_name }}
          body: ${{ inputs.release_notes }}
          draft: true
          files: |
            release-assets/yubera-${{ inputs.version_name }}.apk
            release-assets/yubera-update.json
